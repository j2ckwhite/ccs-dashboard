<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CCS Revenue Parser</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,700;1,9..144,400&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
*, *::before, *::after {
  box-sizing: border-box;
  margin: 0; padding: 0;
  -webkit-print-color-adjust: exact !important;
  print-color-adjust: exact !important;
}

html, body {
  background-color: #0A0F1A;
  color: #F8F9FB;
  font-family: 'Geist', sans-serif;
  font-size: 15px;
  line-height: 1.6;
  min-height: 100vh;
}

/* Ambient blobs */
body::before {
  content: '';
  position: fixed; top: -200px; right: -200px;
  width: 700px; height: 700px;
  background: radial-gradient(circle, rgba(245,158,11,0.12) 0%, transparent 70%);
  pointer-events: none; z-index: 0;
}
body::after {
  content: '';
  position: fixed; bottom: -200px; left: -200px;
  width: 600px; height: 600px;
  background: radial-gradient(circle, rgba(15,22,35,0.9) 0%, transparent 70%);
  pointer-events: none; z-index: 0;
}

.wrapper {
  position: relative; z-index: 1;
  max-width: 1200px;
  margin: 0 auto;
  padding: 48px 32px 80px;
}

/* Header */
.header { margin-bottom: 48px; }
.eyebrow {
  font-family: 'Geist Mono', monospace;
  font-size: 11px; font-weight: 500;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: #F59E0B;
  margin-bottom: 12px;
}
.title {
  font-family: 'Fraunces', serif;
  font-size: clamp(28px, 4vw, 42px);
  font-weight: 400;
  font-variation-settings: 'opsz' 96, 'SOFT' 30;
  letter-spacing: -0.025em;
  color: #F8F9FB;
  line-height: 1.15;
}
.title em {
  font-style: italic;
  color: #F59E0B;
  font-variation-settings: 'opsz' 144;
}
.subtitle {
  margin-top: 10px;
  font-size: 15px;
  color: rgba(255,255,255,0.55);
}

/* Upload area */
.upload-section {
  background: linear-gradient(180deg, rgba(255,255,255,0.025), rgba(255,255,255,0.012));
  border: 1px solid rgba(255,255,255,0.06);
  border-radius: 12px;
  backdrop-filter: blur(14px);
  padding: 32px;
  margin-bottom: 32px;
}
.upload-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 16px;
  margin-bottom: 24px;
}
@media (max-width: 720px) {
  .upload-grid { grid-template-columns: 1fr; }
}
.upload-slot {
  position: relative;
}
.upload-label {
  font-family: 'Geist Mono', monospace;
  font-size: 10px; font-weight: 500;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: rgba(255,255,255,0.55);
  display: block;
  margin-bottom: 8px;
}
.upload-zone {
  border: 1px dashed rgba(255,255,255,0.15);
  border-radius: 8px;
  padding: 20px 16px;
  text-align: center;
  cursor: pointer;
  transition: border-color 0.2s, background 0.2s;
  background: rgba(255,255,255,0.02);
  min-height: 90px;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  gap: 6px;
}
.upload-zone:hover, .upload-zone.drag-over {
  border-color: rgba(245,158,11,0.45);
  background: rgba(245,158,11,0.04);
}
.upload-zone.loaded {
  border-color: rgba(245,158,11,0.35);
  background: rgba(245,158,11,0.06);
}
.upload-icon {
  font-size: 20px; opacity: 0.5;
  transition: opacity 0.2s;
}
.upload-zone.loaded .upload-icon { opacity: 1; }
.upload-zone-text {
  font-size: 12px;
  color: rgba(255,255,255,0.45);
}
.upload-zone.loaded .upload-zone-text {
  color: #F59E0B;
  font-weight: 500;
}
.upload-zone input[type="file"] {
  position: absolute; inset: 0;
  opacity: 0; cursor: pointer;
  width: 100%; height: 100%;
}

.btn-primary {
  display: inline-flex; align-items: center; gap: 8px;
  background: rgba(245,158,11,0.12);
  border: 1px solid rgba(245,158,11,0.45);
  color: #F59E0B;
  font-family: 'Geist', sans-serif;
  font-size: 15px; font-weight: 500;
  padding: 0 28px;
  min-height: 48px;
  border-radius: 999px;
  cursor: pointer;
  transition: background 0.2s, border-color 0.2s, box-shadow 0.2s;
}
.btn-primary:hover:not(:disabled) {
  background: rgba(245,158,11,0.20);
  border-color: rgba(245,158,11,0.70);
  box-shadow: 0 0 24px rgba(245,158,11,0.18);
}
.btn-primary:disabled {
  opacity: 0.4; cursor: not-allowed;
}
.btn-ghost {
  display: inline-flex; align-items: center; gap: 8px;
  background: rgba(255,255,255,0.04);
  border: 1px solid rgba(255,255,255,0.15);
  color: #F8F9FB;
  font-family: 'Geist', sans-serif;
  font-size: 14px; font-weight: 500;
  padding: 0 22px;
  min-height: 40px;
  border-radius: 999px;
  cursor: pointer;
  transition: background 0.2s, border-color 0.2s;
}
.btn-ghost:hover {
  background: rgba(255,255,255,0.08);
  border-color: rgba(255,255,255,0.25);
}

.action-row {
  display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
}
.status-msg {
  font-size: 13px;
  color: rgba(255,255,255,0.45);
  font-family: 'Geist Mono', monospace;
}
.status-msg.error { color: #f87171; }
.status-msg.success { color: #F59E0B; }
.hidden { display: none; }

/* Divider */
.divider {
  height: 1px;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,0.10), transparent);
  margin: 40px 0;
}

/* Results */
#results { display: none; }

.results-header {
  display: flex; align-items: flex-end; justify-content: space-between;
  flex-wrap: wrap; gap: 16px;
  margin-bottom: 28px;
}
.results-meta {
  font-family: 'Geist Mono', monospace;
  font-size: 11px;
  color: rgba(255,255,255,0.45);
  letter-spacing: 0.12em;
}
.stat-pills {
  display: flex; gap: 10px; flex-wrap: wrap;
}
.stat-pill {
  background: rgba(255,255,255,0.04);
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 999px;
  padding: 4px 14px;
  font-family: 'Geist Mono', monospace;
  font-size: 11px;
  color: rgba(255,255,255,0.55);
}
.stat-pill span { color: #F59E0B; font-weight: 500; }

/* Table container */
.table-wrap {
  background: linear-gradient(180deg, rgba(255,255,255,0.025), rgba(255,255,255,0.012));
  border: 1px solid rgba(255,255,255,0.06);
  border-radius: 12px;
  overflow: hidden;
  margin-bottom: 24px;
}
.section-header-row {
  padding: 10px 20px;
  font-family: 'Geist Mono', monospace;
  font-size: 10px; font-weight: 500;
  letter-spacing: 0.14em;
  text-transform: uppercase;
}
.section-header-row.in-template {
  background: rgba(99,179,237,0.08);
  color: rgba(147,210,247,0.9);
  border-bottom: 1px solid rgba(99,179,237,0.12);
}
.section-header-row.not-in-template {
  background: rgba(245,158,11,0.08);
  color: rgba(245,158,11,0.9);
  border-top: 1px solid rgba(255,255,255,0.06);
  border-bottom: 1px solid rgba(245,158,11,0.12);
}

table {
  width: 100%;
  border-collapse: collapse;
  font-size: 13px;
}
thead th {
  background: rgba(255,255,255,0.04);
  padding: 10px 14px;
  font-family: 'Geist Mono', monospace;
  font-size: 10px; font-weight: 500;
  letter-spacing: 0.13em;
  text-transform: uppercase;
  color: rgba(255,255,255,0.45);
  text-align: left;
  border-bottom: 1px solid rgba(255,255,255,0.06);
  white-space: nowrap;
}
thead th.num { text-align: right; }
tbody tr {
  border-bottom: 1px solid rgba(255,255,255,0.04);
  transition: background 0.15s;
}
tbody tr:last-child { border-bottom: none; }
tbody tr:hover { background: rgba(255,255,255,0.025); }
tbody tr.alt { background: rgba(255,255,255,0.015); }
tbody tr.alt:hover { background: rgba(255,255,255,0.035); }
td {
  padding: 9px 14px;
  color: rgba(255,255,255,0.72);
  vertical-align: middle;
}
td.proj-num {
  font-family: 'Geist Mono', monospace;
  font-size: 12px;
  color: rgba(255,255,255,0.45);
  white-space: nowrap;
}
td.proj-name {
  color: #F8F9FB;
  font-weight: 500;
  max-width: 340px;
}
td.prime {
  color: rgba(255,255,255,0.55);
  font-size: 13px;
  white-space: nowrap;
}
td.money {
  font-family: 'Geist Mono', monospace;
  font-size: 12px;
  text-align: right;
  white-space: nowrap;
}
td.money.zero { color: rgba(255,255,255,0.25); }
td.money.positive { color: rgba(255,255,255,0.72); }
td.money.negative {
  color: #f87171;
  font-weight: 500;
}
td.calc {
  font-family: 'Geist Mono', monospace;
  font-size: 11px;
  font-weight: 500;
  color: #F59E0B;
  text-align: right;
  letter-spacing: 0.08em;
}

/* Totals row */
tr.totals-row td {
  border-top: 1px solid rgba(255,255,255,0.10);
  font-weight: 600;
  color: #F8F9FB;
  background: rgba(255,255,255,0.03);
  font-family: 'Geist Mono', monospace;
  font-size: 12px;
}
tr.totals-row td.label {
  font-family: 'Geist', sans-serif;
  font-size: 13px;
  letter-spacing: 0;
}
</style>
</head>
<body>
<div class="wrapper">

  <div class="header">
    <div class="eyebrow">CCS Revenue Tools</div>
    <h1 class="title">Revenue <em>Parser</em></h1>
    <p class="subtitle">Upload the three monthly files to generate your revenue summary.</p>
  </div>

  <div class="upload-section">
    <div class="upload-grid">

      <div class="upload-slot">
        <span class="upload-label">1. Budget Sheet</span>
        <label class="upload-zone" id="zone-template" for="file-template">
          <div class="upload-icon">📊</div>
          <div class="upload-zone-text" id="label-template">Upload Budget Sheet</div>
          <input type="file" id="file-template" accept=".xlsx,.xls" onchange="handleFile('template', this)">
        </label>
      </div>

      <div class="upload-slot">
        <span class="upload-label">2. Month Sheet</span>
        <label class="upload-zone" id="zone-monthly" for="file-monthly">
          <div class="upload-icon">🧾</div>
          <div class="upload-zone-text" id="label-monthly">Upload Month Sheet</div>
          <input type="file" id="file-monthly" accept=".xlsx,.xls" onchange="handleFile('monthly', this)">
        </label>
      </div>

      <div class="upload-slot">
        <span class="upload-label">3. YTD Sheet</span>
        <label class="upload-zone" id="zone-ytd" for="file-ytd">
          <div class="upload-icon">📈</div>
          <div class="upload-zone-text" id="label-ytd">Upload YTD Sheet</div>
          <input type="file" id="file-ytd" accept=".xlsx,.xls" onchange="handleFile('ytd', this)">
        </label>
      </div>

    </div>

    <div class="action-row">
      <button class="btn-primary" id="run-btn" onclick="runParser()" disabled>
        Generate Report →
      </button>
      <button class="btn-ghost hidden" id="clear-btn" onclick="clearAll()">
        Clear
      </button>
      <span class="status-msg" id="status-msg">Upload all three files to begin.</span>
    </div>
  </div>

  <div id="results">
    <div class="divider"></div>

    <div class="results-header">
      <div>
        <div class="eyebrow" id="results-period"></div>
        <div style="font-family:'Fraunces',serif;font-size:22px;font-weight:400;letter-spacing:-0.02em;">Revenue Summary</div>
      </div>
      <div style="display:flex;flex-direction:column;gap:10px;align-items:flex-end;">
        <div class="stat-pills" id="stat-pills"></div>
        <button class="btn-ghost" onclick="exportExcel()">Export to Excel ↓</button>
      </div>
    </div>

    <div class="table-wrap" id="table-wrap">
      <!-- rendered by JS -->
    </div>

  </div>

</div>

<script>
const files = { template: null, monthly: null, ytd: null };
let parsedData = null;

function clearAll() {
  ['template', 'monthly', 'ytd'].forEach(key => {
    files[key] = null;
    document.getElementById('file-' + key).value = '';
    document.getElementById('zone-' + key).classList.remove('loaded');
    document.getElementById('label-' + key).textContent =
      key === 'template' ? 'Upload Budget Sheet' :
      key === 'monthly'  ? 'Upload Month Sheet'  : 'Upload YTD Sheet';
  });
  parsedData = null;
  document.getElementById('results').style.display = 'none';
  document.getElementById('run-btn').disabled = true;
  document.getElementById('clear-btn').classList.add('hidden');
  setStatus('Upload all three files to begin.', '');
}

function handleFile(key, input) {
  const file = input.files[0];
  if (!file) return;
  files[key] = file;
  const zone = document.getElementById('zone-' + key);
  const label = document.getElementById('label-' + key);
  zone.classList.add('loaded');
  label.textContent = file.name;
  checkReady();
}

function checkReady() {
  const ready = files.template && files.monthly && files.ytd;
  const any   = files.template || files.monthly || files.ytd;
  document.getElementById('run-btn').disabled = !ready;
  document.getElementById('clear-btn').classList.toggle('hidden', !any);
  if (ready) setStatus('Ready — click Generate Report.', '');
}

function setStatus(msg, type) {
  const el = document.getElementById('status-msg');
  el.textContent = msg;
  el.className = 'status-msg' + (type ? ' ' + type : '');
}

async function readWorkbook(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = e => {
      try {
        const wb = XLSX.read(e.target.result, { type: 'array', cellDates: true });
        resolve(wb);
      } catch(err) { reject(err); }
    };
    reader.onerror = reject;
    reader.readAsArrayBuffer(file);
  });
}

function parseTemplate(wb) {
  const ws = wb.Sheets[wb.SheetNames[0]];
  const rows = XLSX.utils.sheet_to_json(ws, { header: 1, defval: null });
  const map = {};
  for (const row of rows) {
    const projNum = row[2];
    const name = row[1];
    const prime = row[3];
    const remaining = row[8];
    if (projNum && typeof projNum === 'number' && name && typeof name === 'string') {
      const nameClean = name.trim();
      const primeClean = (prime && typeof prime === 'string' && prime.trim() !== '') ? prime.trim() : null;
      const rem = (typeof remaining === 'number') ? remaining : null;
      if (nameClean && nameClean !== '#REF!') {
        map[Math.round(projNum)] = { name: nameClean, prime: primeClean, remaining: rem };
      } else {
        // Store with null name so we can fill from invoice log
        map[Math.round(projNum)] = { name: null, prime: primeClean, remaining: rem };
      }
    }
  }
  return map;
}

function parseInvoiceLog(wb) {
  const ws = wb.Sheets[wb.SheetNames[0]];
  const rows = XLSX.utils.sheet_to_json(ws, { header: 1, defval: null });

  // Detect period from row 3 (index 2)
  let period = '';
  if (rows[2] && rows[2][11]) period = String(rows[2][11]).trim();

  const billed = {};   // projNum -> total amount
  const names = {};    // projNum -> name
  const clients = {};  // projNum -> client (= prime firm)

  for (const row of rows) {
    const projNum = row[3];
    const name = row[4];
    const client = row[7];
    const amount = row[8];
    if (projNum && typeof projNum === 'number' && typeof amount === 'number') {
      const pn = Math.round(projNum);
      billed[pn] = (billed[pn] || 0) + amount;
      if (!names[pn] && name && typeof name === 'string' && name.trim()) {
        names[pn] = name.trim();
      }
      if (!clients[pn] && client && typeof client === 'string' && client.trim()) {
        clients[pn] = client.trim();
      }
    }
  }
  return { billed, names, clients, period };
}

function detectMonthLabel(period) {
  // e.g. "04 (Apr 2026) to 04 (Apr 2026),..."
  const match = period.match(/(\w{3}\s+\d{4})\s+to\s+(\w{3}\s+\d{4})/i)
    || period.match(/\((\w{3} \d{4})\).*\((\w{3} \d{4})\)/i);
  if (match) {
    const from = match[1] || match[2];
    const to = match[2] || match[1];
    if (from === to) return from;
    return `${from} – ${to}`;
  }
  // Fallback: grab first parenthesized date
  const m2 = period.match(/\(([^)]+)\)/);
  return m2 ? m2[1] : period.substring(0, 40);
}

async function runParser() {
  setStatus('Parsing files…', '');
  document.getElementById('run-btn').disabled = true;

  try {
    const [wbTemplate, wbMonthly, wbYTD] = await Promise.all([
      readWorkbook(files.template),
      readWorkbook(files.monthly),
      readWorkbook(files.ytd)
    ]);

    const template   = parseTemplate(wbTemplate);
    const monthly    = parseInvoiceLog(wbMonthly);
    const ytd        = parseInvoiceLog(wbYTD);

    const monthLabel = detectMonthLabel(monthly.period) || 'Current Month';
    const ytdLabel   = detectMonthLabel(ytd.period)     || 'YTD';

    // Union of all invoiced projects
    const allProjs = new Set([
      ...Object.keys(monthly.billed).map(Number),
      ...Object.keys(ytd.billed).map(Number)
    ]);

    const rowsIn = [], rowsOut = [];

    for (const pn of [...allProjs].sort((a,b) => a-b)) {
      const aprAmt = monthly.billed[pn] || 0;
      const ytdAmt = ytd.billed[pn]    || 0;

      if (pn in template) {
        const t = template[pn];
        const name  = t.name  || ytd.names[pn]    || monthly.names[pn]    || String(pn);
        const prime = t.prime || ytd.clients[pn]  || monthly.clients[pn]  || '';
        const rem   = t.remaining !== null ? +(t.remaining - ytdAmt).toFixed(2) : null;
        rowsIn.push({ pn, name, prime, apr: aprAmt, ytd: ytdAmt, rem });
      } else {
        const name  = ytd.names[pn]    || monthly.names[pn]    || String(pn);
        const prime = ytd.clients[pn]  || monthly.clients[pn]  || '';
        rowsOut.push({ pn, name, prime, apr: aprAmt, ytd: ytdAmt });
      }
    }

    parsedData = { rowsIn, rowsOut, monthLabel, ytdLabel };
    renderResults(parsedData);
    setStatus('Done.', 'success');

  } catch(err) {
    console.error(err);
    setStatus('Error: ' + err.message, 'error');
  }

  document.getElementById('run-btn').disabled = false;
}

function fmt(n) {
  if (typeof n !== 'number') return '—';
  return n.toLocaleString('en-US', { style: 'currency', currency: 'USD', minimumFractionDigits: 2 });
}

function renderResults({ rowsIn, rowsOut, monthLabel, ytdLabel }) {
  const resultsEl = document.getElementById('results');
  resultsEl.style.display = 'block';

  document.getElementById('results-period').textContent = monthLabel + '  ·  YTD ' + ytdLabel;

  // Stats
  const totalApr = rowsIn.reduce((s,r) => s + r.apr, 0) + rowsOut.reduce((s,r) => s + r.apr, 0);
  const totalYTD = rowsIn.reduce((s,r) => s + r.ytd, 0) + rowsOut.reduce((s,r) => s + r.ytd, 0);
  const negCount = rowsIn.filter(r => r.rem !== null && r.rem < 0).length;
  document.getElementById('stat-pills').innerHTML = `
    <div class="stat-pill">Current Month Total: <span>${fmt(totalApr)}</span></div>
    <div class="stat-pill">YTD Total: <span>${fmt(totalYTD)}</span></div>
    <div class="stat-pill">In Template: <span>${rowsIn.length}</span></div>
    <div class="stat-pill">Not In Template: <span>${rowsOut.length}</span></div>
    ${negCount > 0 ? `<div class="stat-pill" style="border-color:rgba(248,113,113,0.3);color:#f87171;">⚠ Negative Remaining: <span style="color:#f87171">${negCount}</span></div>` : ''}
  `;

  // Build table
  const cols = ['Project #', 'Project Name', 'Prime', 'Current Month Billed', 'YTD Budget EX GO GET', 'YTD Billed Thru Current Month', 'Updated Remaining'];
  let html = `
    <div class="section-header-row in-template">
      ✦ ${rowsIn.length} projects in budget template — remaining auto-calculated
    </div>
    <table>
      <thead>
        <tr>
          ${cols.map((c,i) => `<th${i>=3?' class="num"':''}>${c}</th>`).join('')}
        </tr>
      </thead>
      <tbody>
  `;

  rowsIn.forEach((r, i) => {
    const alt = i % 2 === 1 ? ' class="alt"' : '';
    const remCell = r.rem === null
      ? `<td class="calc">CALC</td>`
      : r.rem < 0
        ? `<td class="money negative">${fmt(r.rem)}</td>`
        : `<td class="money positive">${fmt(r.rem)}</td>`;
    html += `
      <tr${alt}>
        <td class="proj-num">${r.pn}</td>
        <td class="proj-name">${esc(r.name)}</td>
        <td class="prime">${esc(r.prime)}</td>
        <td class="money ${r.apr === 0 ? 'zero' : 'positive'}">${r.apr === 0 ? '—' : fmt(r.apr)}</td>
        <td></td>
        <td class="money ${r.ytd === 0 ? 'zero' : 'positive'}">${fmt(r.ytd)}</td>
        ${remCell}
      </tr>`;
  });

  // In-template totals
  const inApr = rowsIn.reduce((s,r)=>s+r.apr,0);
  const inYTD = rowsIn.reduce((s,r)=>s+r.ytd,0);
  html += `
    <tr class="totals-row">
      <td colspan="3" class="label">Subtotal — In Template</td>
      <td class="money">${fmt(inApr)}</td>
      <td></td>
      <td class="money">${fmt(inYTD)}</td>
      <td></td>
    </tr>
  </tbody></table>`;

  if (rowsOut.length > 0) {
    html += `
      <div class="section-header-row not-in-template">
        ⚠ ${rowsOut.length} projects not in budget template — calculate remaining manually
      </div>
      <table>
        <thead>
          <tr>
            ${cols.map((c,i) => `<th${i>=3?' class="num"':''}>${c}</th>`).join('')}
          </tr>
        </thead>
        <tbody>
    `;
    rowsOut.forEach((r, i) => {
      const alt = i % 2 === 1 ? ' class="alt"' : '';
      html += `
        <tr${alt}>
          <td class="proj-num">${r.pn}</td>
          <td class="proj-name">${esc(r.name)}</td>
          <td class="prime">${esc(r.prime)}</td>
          <td class="money ${r.apr === 0 ? 'zero' : 'positive'}">${r.apr === 0 ? '—' : fmt(r.apr)}</td>
          <td></td>
          <td class="money ${r.ytd === 0 ? 'zero' : 'positive'}">${fmt(r.ytd)}</td>
          <td class="calc">CALC</td>
        </tr>`;
    });
    const outApr = rowsOut.reduce((s,r)=>s+r.apr,0);
    const outYTD = rowsOut.reduce((s,r)=>s+r.ytd,0);
    html += `
      <tr class="totals-row">
        <td colspan="3" class="label">Subtotal — Not In Template</td>
        <td class="money">${fmt(outApr)}</td>
        <td></td>
        <td class="money">${fmt(outYTD)}</td>
        <td class="calc">CALC</td>
      </tr>
    </tbody></table>`;
  }

  document.getElementById('table-wrap').innerHTML = html;
  resultsEl.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function esc(str) {
  if (!str) return '';
  return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function exportExcel() {
  if (!parsedData) return;
  const { rowsIn, rowsOut, monthLabel, ytdLabel } = parsedData;

  const wb = XLSX.utils.book_new();
  const sheetData = [];

  // Headers
  sheetData.push(['Project #', 'Project Name', 'Prime', 'Current Month Billed', 'YTD Budget EX GO GET', 'YTD Billed Thru Current Month', 'Updated Remaining']);

  sheetData.push(['— IN BUDGET TEMPLATE —', '', '', '', '', '']);
  rowsIn.forEach(r => {
    sheetData.push([r.pn, r.name, r.prime, r.apr, '', r.ytd, r.rem !== null ? r.rem : 'CALC']);
  });
  sheetData.push(['SUBTOTAL', '', '', rowsIn.reduce((s,r)=>s+r.apr,0), '', rowsIn.reduce((s,r)=>s+r.ytd,0), '']);

  sheetData.push(['']);

  sheetData.push(['— NOT IN BUDGET TEMPLATE —', '', '', '', '', '']);
  rowsOut.forEach(r => {
    sheetData.push([r.pn, r.name, r.prime, r.apr, '', r.ytd, 'CALC']);
  });
  sheetData.push(['SUBTOTAL', '', '', rowsOut.reduce((s,r)=>s+r.apr,0), '', rowsOut.reduce((s,r)=>s+r.ytd,0), 'CALC']);

  const ws = XLSX.utils.aoa_to_sheet(sheetData);
  ws['!cols'] = [14,52,26,16,22,20,20].map(w => ({ wch: w }));
  XLSX.utils.book_append_sheet(wb, ws, 'Revenue Summary');

  const monthSlug = monthLabel.replace(/[^a-zA-Z0-9]/g, '-').replace(/-+/g,'-');
  XLSX.writeFile(wb, `CCS-Revenue-Summary-${monthSlug}.xlsx`);
}
